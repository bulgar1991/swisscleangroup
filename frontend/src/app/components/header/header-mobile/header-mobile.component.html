<div class="site-header">
  <div class="container mx-auto px-4">
    <div class="site-header__inner-container">
      <a class="site-header__logo-container" routerLink="/" data-testid="header-logo-mobile">
        <img [src]="siteLogo" alt="Swiss Clean Group" width="60" height="60" />
      </a>

      <div class="site-header__actions">
        <!-- Quick contact without opening the menu -->
        <app-contact-buttons [only]="['phone', 'whatsapp']" />
        <button
          type="button"
          class="site-header__burger"
          [attr.aria-expanded]="sidebarOpen()"
          aria-controls="mobile-sidebar"
          [attr.aria-label]="'header.openMenu' | translate"
          data-testid="mobile-menu-open"
          (click)="openSidebar()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </div>
</div>

@if (sidebarOpen()) {
  <div class="sidebar-overlay" (click)="closeSidebar()" aria-hidden="true"></div>
  <div
    id="mobile-sidebar"
    class="sidebar"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'header.mainMenu' | translate"
    data-testid="mobile-menu"
  >
    <div class="sidebar__header">
      <a class="sidebar__logo" routerLink="/" (click)="closeSidebar()">
        <img [src]="sidebarLogo" alt="Swiss Clean Group" class="sidebar__logo-img" width="108" height="36" />
      </a>
      <button
        type="button"
        class="sidebar__close"
        [attr.aria-label]="'header.closeMenu' | translate"
        data-testid="mobile-menu-close"
        (click)="closeSidebar()"
      >
        <i class="icon-xmark-solid-full" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="sidebar__nav" [attr.aria-label]="'header.mainMenu' | translate" data-testid="mobile-navigation">
      @for (item of menuItems; track item.labelKey) {
        <a
          class="sidebar__link"
          [routerLink]="item.link"
          routerLinkActive="sidebar__link--active"
          [routerLinkActiveOptions]="activeOptions"
          ariaCurrentWhenActive="page"
          [attr.data-testid]="'mobile-nav-link-' + item.id"
          (click)="closeSidebar()"
        >
          {{ item.labelKey | translate }}
          <i class="icon-angle-right-solid-full" aria-hidden="true"></i>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <app-contact-buttons theme="dark" />
      <app-language-switcher variant="inline" />
      <a class="btn sidebar__cta" routerLink="/contact" data-testid="mobile-menu-contact" (click)="closeSidebar()">
        {{ 'header.contactCta' | translate }}
      </a>
    </div>
  </div>
}
