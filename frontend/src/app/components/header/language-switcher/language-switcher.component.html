@if (variant() === 'dropdown') {
  <div class="language-switcher language-switcher--dropdown">
    <button
      type="button"
      class="language-switcher__toggle"
      [attr.aria-expanded]="open()"
      aria-haspopup="true"
      [attr.aria-label]="'header.language' | translate"
      data-testid="language-switcher-toggle"
      (click)="toggle()"
    >
      <img class="language-switcher__flag" [src]="currentLanguage().flag" alt="" width="21" height="14" />
      {{ currentLanguage().label }}
      <i
        class="icon-angle-down-solid-full language-switcher__chevron"
        [class.language-switcher__chevron--open]="open()"
        aria-hidden="true"
      ></i>
    </button>

    <ul class="language-switcher__menu" [class.language-switcher__menu--open]="open()">
      @for (lang of languages; track lang.code) {
        <li>
          <a
            class="language-switcher__option"
            [class.language-switcher__option--active]="lang.code === currentCode()"
            [attr.aria-current]="lang.code === currentCode() ? 'page' : null"
            [attr.lang]="lang.code"
            [attr.hreflang]="lang.code"
            [routerLink]="links()[lang.code]"
            [attr.data-testid]="'language-option-' + lang.code"
            (click)="close()"
          >
            <img class="language-switcher__flag" [src]="lang.flag" alt="" width="21" height="14" />
            <span class="language-switcher__code">{{ lang.label }}</span>
            {{ lang.name }}
          </a>
        </li>
      }
    </ul>
  </div>
} @else {
  <div
    class="language-switcher language-switcher--inline"
    role="group"
    [attr.aria-label]="'header.language' | translate"
  >
    @for (lang of languages; track lang.code) {
      <a
        class="language-switcher__pill"
        [class.language-switcher__pill--active]="lang.code === currentCode()"
        [attr.aria-current]="lang.code === currentCode() ? 'page' : null"
        [attr.lang]="lang.code"
        [attr.hreflang]="lang.code"
        [title]="lang.name"
        [routerLink]="links()[lang.code]"
        [attr.data-testid]="'language-option-' + lang.code"
      >
        <img class="language-switcher__flag" [src]="lang.flag" alt="" width="21" height="14" />
        {{ lang.label }}
      </a>
    }
  </div>
}
