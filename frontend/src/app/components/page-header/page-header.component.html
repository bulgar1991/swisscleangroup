<section class="page-header">
  <img class="page-header__image" [src]="image()" alt="" aria-hidden="true">
  <div class="page-header__overlay"></div>

  <div class="container mx-auto px-4 lg:px-6 page-header__content">
    <nav class="page-header__breadcrumb" [attr.aria-label]="'pages.breadcrumb' | translate">
      <a routerLink="/">{{ 'header.menu.home' | translate }}</a>
      <i class="icon-chevron-right" aria-hidden="true"></i>
      <span aria-current="page">{{ titleKey() | translate }}</span>
    </nav>
    <h1 class="page-header__title">{{ titleKey() | translate }}</h1>
    @if (subtitleKey(); as subtitleKey) {
      <p class="page-header__subtitle">{{ subtitleKey | translate }}</p>
    }
  </div>
</section>
