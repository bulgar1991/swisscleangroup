<header class="page-header" data-testid="page-header">
  <img
    class="page-header__image"
    [src]="image()"
    alt=""
    width="1920"
    height="1280"
    fetchpriority="high"
  />
  <div class="page-header__overlay"></div>

  <div class="container mx-auto px-4 lg:px-6 page-header__content">
    <nav
      class="page-header__breadcrumb"
      [attr.aria-label]="'pages.breadcrumb' | translate"
      data-testid="breadcrumb"
    >
      <ol>
        <li>
          <a routerLink="/" data-testid="breadcrumb-home">{{ 'header.menu.home' | translate }}</a>
        </li>
        @if (parent(); as parent) {
          <li>
            <i class="icon-angle-right-solid-full" aria-hidden="true"></i>
            <a [routerLink]="parent.link" data-testid="breadcrumb-parent">{{ parent.labelKey | translate }}</a>
          </li>
        }
        <li>
          <i class="icon-angle-right-solid-full" aria-hidden="true"></i>
          <span aria-current="page">{{ titleKey() | translate }}</span>
        </li>
      </ol>
    </nav>
    <h1 class="page-header__title" data-testid="page-title">{{ titleKey() | translate }}</h1>
    @if (subtitleKey(); as subtitleKey) {
      <p class="page-header__subtitle">{{ subtitleKey | translate }}</p>
    }
  </div>
</header>
