<a class="post-card" [routerLink]="service().link" [attr.data-testid]="'service-card-' + service().id">
  <div class="post-card__image-wrapper">
    <img
      class="post-card__image"
      [src]="service().image"
      [alt]="service().key + '.imageAlt' | translate"
      width="1280"
      height="800"
      loading="lazy"
    />
  </div>
  <div class="post-card__body">
    <h3 class="post-card__title">{{ service().key + '.title' | translate }}</h3>
    <span class="post-card__link">
      {{ 'servicesSlider.viewDetails' | translate }}
      <i class="icon-arrow-right-solid-full" aria-hidden="true"></i>
    </span>
  </div>
</a>
