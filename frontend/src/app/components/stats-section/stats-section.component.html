<section class="stats" [attr.aria-label]="'stats.ariaLabel' | translate">
  <div class="container mx-auto px-4 lg:px-6">
    <ul class="stats__grid">
      @for (stat of stats; track stat.key; let i = $index) {
        <li class="stat">
          <span class="stat__icon" aria-hidden="true">
            <i class="icon-{{ stat.icon }}"></i>
          </span>
          <p class="stat__number">
            <span [appCountUp]="stat.value" [countUpDelay]="i * stagger">0</span>{{ stat.suffix }}
          </p>
          <p class="stat__label">{{ stat.key | translate }}</p>
        </li>
      }
    </ul>
  </div>
</section>
