<!doctype html>
<html lang="fr">

    <base href="/" />

    <meta name="theme-color" content="#da291c" />

    <!-- Icons -->
    <link href="favicon.ico" rel="icon" sizes="48x48" />
    <link href="assets/icons/app/icon-32.png" rel="icon" type="image/png" sizes="32x32" />
    <link href="assets/icons/app/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <link href="site.webmanifest" rel="manifest" />

    <!-- Primary meta (fallback, overwritten by SeoService at runtime) -->
    <meta
      name="description"
      content="Nettoyage de vitres et montage de meubles pour particuliers et entreprises en Suisse. Devis gratuit, équipe fiable et prix transparents." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swiss Clean Group" />
    <meta property="og:locale" content="fr_CH" />
    <meta property="og:locale:alternate" content="de_CH" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:title" content="Nettoyage de vitres et montage de meubles | Swiss Clean Group" />
    <meta
      property="og:description"
      content="Nettoyage de vitres et montage de meubles pour particuliers et entreprises en Suisse. Devis gratuit, équipe fiable et prix transparents." />
    <meta property="og:url" content="https://www.swisscleangroup.ch/" />
    <meta property="og:image" content="https://www.swisscleangroup.ch/assets/images/seo/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Swiss Clean Group" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nettoyage de vitres et montage de meubles | Swiss Clean Group" />
    <meta
      name="twitter:description"
      content="Nettoyage de vitres et montage de meubles pour particuliers et entreprises en Suisse. Devis gratuit, équipe fiable et prix transparents." />
    <meta name="twitter:image" content="https://www.swisscleangroup.ch/assets/images/seo/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.swisscleangroup.ch/" />

    <!-- Structured data: tells Google this is a local business (name, contact, area served).
         Dummy contact data - keep in sync with src/app/config/contact.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Swiss Clean Group",
        "description": "Nettoyage de vitres et montage de meubles pour particuliers et entreprises en Suisse.",
        "url": "https://www.swisscleangroup.ch/",
        "logo": "https://www.swisscleangroup.ch/assets/icons/app/icon-512.png",
        "image": "https://www.swisscleangroup.ch/assets/images/seo/og-image.jpg",
        "telephone": "+41000000000",
        "email": "info@swisscleangroup.ch",
        "areaServed": { "@type": "Country", "name": "Switzerland" },
        "sameAs": ["https://www.facebook.com/", "https://www.instagram.com/"],
        "knowsLanguage": ["fr", "de", "en"]
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
